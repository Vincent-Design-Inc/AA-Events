  - contentinfo [ref=f3e75]:
    - generic [ref=f3e77]:
      - heading "Land Acknowledgement" [level=2] [ref=f3e79]
      - generic [ref=f3e91]:
        - paragraph [ref=f3e92]: Métis Nation British Columbia respects the inherent and treaty rights of all 204 First Nations across British Columbia, where our work takes place. We recognize and honour their continued stewardship and governance.
        - paragraph [ref=f3e93]: Métis Nation British Columbia is the Métis government in British Columbia, and recognizes the 38 Métis Chartered Communities located across the province. These Métis Chartered Communities provide Métis people with local programming and opportunities for cultural connection and belonging, sometimes after generations of displacement. We celebrate the meaningful contributions of these Communities and of Métis people, both historically and in the present day.
